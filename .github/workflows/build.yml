name: Build & Release flybrain-nx

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-switch:
    name: Build flybrain-nx (Switch NRO)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RomFS Connectome Asset
        run: |
          python3 tools/extract_connectome.py --generate-reference --neurons 10000 --output romfs/drosophila_full.bin

      - name: Run Picross & SNN Logic Verification Suite
        run: |
          python3 tests/test_picross_logic.py

      - name: Compile Native NRO Target
        run: |
          make clean
          make -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-nx-Artifacts
          path: |
            flybrain-nx.nro
            flybrain-nx.nacp

  package-release:
    name: Package Suite & Publish GitHub Release
    needs: [build-switch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Switch Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flybrain-nx-Artifacts
          path: dist/

      - name: Assemble SD Card Structure & Zip
        run: |
          cp dist/flybrain-nx.nro ./flybrain-nx.nro
          python3 build_release.py

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: flybrain-nx ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          draft: false
          prerelease: false
          files: |
            release/flybrain-nx-switch-v1.1.0.zip
            release/flybrain-nx.nro
            release/flybrain-nx.xml
          body: |
            ## flybrain-nx v1.1.0 — The Fruit Fly Brain Solves Picross!

            Official release compiled natively from source using **devkitA64**.

            ### What's New in v1.1.0:
            - **Biological Neuromorphic Picross Solver (SNN-CSP):** The full *Drosophila melanogaster* connectome (~139k neurons, ~50M synapses) operates as a constraint satisfaction attractor network to solve Nonograms.
            - **Split-Screen Dual Viewports (1280×720):**
              - **Left Panel (640×720):** Interactive Picross board with dynamic numeric clues, strikethroughs, cell cursors, and an animated embodied fruit fly avatar navigating tiles to ink squares with its proboscis or scratch crosses with its legs.
              - **Right Panel (640×720):** 3D rotating Drosophila connectome with real-time axon vector lines connecting active neural clusters as clues are evaluated.
            - **Autonomous & Manual Game Modes:**
              - **Autopilot (Fly Solves):** Watch the fly brain autonomously evaluate row/column constraints and solve puzzles step-by-step.
              - **Manual Play:** Play traditional Nonograms using Joy-Con D-Pad and buttons with real-time neural sensory feedback.
            - **Built-in Handcrafted Puzzle Catalog:** 8 hand-designed 5×5 and 10×10 puzzles (Fruit Fly, Heart SOUL, Master Sword, Nintendo Switch, Super Mushroom, Drosophila Larva, Brain Connectome, Space Invader).
            - **Firmware 22.5.0 Safe:** Strict Title Override intercept prevents Horizon OS memory crashes out of the box.

            ### SD Card Installation:
            1. Extract `flybrain-nx-switch-v1.1.0.zip` to the root of your SD card (`sdmc:/switch/flybrain-nx/`).
            2. Launch via **Title Override**: Hold `[R]` while launching ANY installed game from the HOME Menu.
            3. Open `flybrain-nx` from the Homebrew Menu.
