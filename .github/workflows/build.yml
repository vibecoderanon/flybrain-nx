name: Build & Release flybrain-nx

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-switch:
    name: Build flybrain-nx (Switch NRO)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RomFS Connectome Asset
        run: |
          python3 tools/extract_connectome.py --generate-reference --neurons 10000 --output romfs/drosophila_full.bin

      - name: Run Picross & SNN Logic Verification Suite
        run: |
          python3 tests/test_picross_logic.py

      - name: Compile Native NRO Target
        run: |
          make clean
          make -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-nx-Artifacts
          path: |
            flybrain-nx.nro
            flybrain-nx.nacp

  package-release:
    name: Package Suite & Publish GitHub Release
    needs: [build-switch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Switch Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flybrain-nx-Artifacts
          path: dist/

      - name: Assemble SD Card Structure & Zip
        run: |
          cp dist/flybrain-nx.nro ./flybrain-nx.nro
          python3 build_release.py

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          name: flybrain-nx ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          draft: false
          prerelease: false
          files: |
            release/flybrain-nx-switch-v1.2.0.zip
            release/flybrain-nx.nro
            release/flybrain-nx.xml
          body: |
            ## flybrain-nx v1.2.0 — Drosophila Connectome Picross: Viral Overhaul

            Official release compiled natively from source using **devkitA64**.

            ### What's New in v1.2.0:
            - **Biological Spectator Neural Gauges (Stonkfly / Doomfly Inspired):**
              - **[🍬 PAM11 DOPAMINE]:** Spikes radiant emerald green (+3.5mV) when a clue constraint is satisfied or progress advances.
              - **[⚡ PPL101 AVERSIVE]:** Flashes crimson on contradiction or constraint violations.
              - **[👁️ OPTIC SCAN]:** Electric cyan meter illuminates while reading row/column clues.
              - **[🧭 COMPASS (CX)]:** Solar gold meter indicates active central complex heading calculation.
            - **Strict Physical-First Causality (4-Stage Thought Cycle):**
              - *Scan $\rightarrow$ Crawl $\rightarrow$ Inspect $\rightarrow$ Actuate*: Zero premature tile mutation.
              - Tiles mutate and clues strike through **only on the exact frame the proboscis touches the paper** with an expanding ink droplet animation!
            - **Live Thought Monologue Banner:**
              - Real-time narration capsule displaying the fly's observations, hypotheses, and physical actuation decisions.
            - **Sensory Scan Reticle & Clue Laser Highlighting:**
              - Amber laser targeting beam across active row/column clues connecting the fly's eyes to the puzzle constraints.
            - **3D Anatomical Neuropil Badges & Deliberation Highway Spotlight:**
              - Floating 3D labels for `[OPTIC LOBES]`, `[MUSHROOM BODY]`, `[CENTRAL COMPLEX]`, and `[MOTOR SEZ]`.
              - Active functional brain regions illuminate in high contrast as signals propagate from sensory input to motor output.
            - **Multi-Pacing Selector (`[X]` Joy-Con Button):**
              - **Observational Mode (Default, ~2.2s):** Human-readable pacing to watch brain reasoning and physical crawling.
              - **Fast Mode (~0.9s):** Rapid solving with preserved physical contact synchronization.
              - **Step-by-Step Mode (`[A]`):** Advance each logical deduction on command.
              - **Manual Play:** Direct Joy-Con control with real-time neural sensory feedback.
            - **Firmware 22.5.0 Safe:** Strict Title Override intercept prevents Horizon OS memory crashes.

            ### SD Card Installation:
            1. Extract `flybrain-nx-switch-v1.2.0.zip` to the root of your SD card (`sdmc:/switch/flybrain-nx/`).
            2. Launch via **Title Override**: Hold `[R]` while launching ANY installed game from the HOME Menu.
            3. Open `flybrain-nx` from the Homebrew Menu.
