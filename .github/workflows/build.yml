name: Build & Release flybrain-nx

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-switch:
    name: Build flybrain-nx (Switch NRO)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RomFS Connectome Asset
        run: |
          python3 tools/extract_connectome.py --generate-reference --neurons 10000 --output romfs/drosophila_full.bin

      - name: Run Picross & SNN Logic Verification Suite
        run: |
          python3 tests/test_picross_logic.py

      - name: Compile Native NRO Target
        run: |
          make clean
          make -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-nx-Artifacts
          path: |
            flybrain-nx.nro
            flybrain-nx.nacp

  package-release:
    name: Package Suite & Publish GitHub Release
    needs: [build-switch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Switch Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flybrain-nx-Artifacts
          path: dist/

      - name: Assemble SD Card Structure & Zip
        run: |
          cp dist/flybrain-nx.nro ./flybrain-nx.nro
          python3 build_release.py

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: flybrain-nx ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          draft: false
          prerelease: false
          files: |
            release/flybrain-nx-switch-v1.3.0.zip
            release/flybrain-nx.nro
            release/flybrain-nx.xml
          body: |
            ## flybrain-nx v1.3.0 — High-Clarity Drosophila Connectome 3D Visualizer & Circuit Highway

            Official release compiled natively from source using **devkitA64**.

            ### What's New in v1.3.0:
            - **Two-Tier Visual Connectome Hierarchy (Zero Clutter):**
              - 10,000 background neurons rendered as a sleek, low-luminance translucent anatomical scaffold (~15–20% opacity).
              - Completely eliminates point-cloud white noise while preserving the unmistakable 3D silhouette of the fruit fly brain.
            - **Prominent Glowing Macro-Nodes & Target Tile Reticle:**
              - Active firing neurons render as 3px–5px radiant orbs with multi-stage bloom.
              - The neuron corresponding to the active Picross deduction tile receives a pulsing golden target reticle and an on-screen coordinate pill tag `(R, C)`.
            - **Directed Causal Axon Pulses with Traveling Energy Packets:**
              - Replaced the 800-line Poisson noise spiderweb with 16–24 directed synaptic conduits matching the active cognitive phase.
              - Animated action potential energy packets travel along axons over ~0.35s, allowing the human eye to track signal flow from optic lobe to motor SEZ.
              - Drops software rendering load by ~90% and restores locked **60 FPS** performance on Switch.
            - **Bilateral Neuropil Separation & Solid Pill Callout Badges:**
              - Separated bilateral optic lobes into `[L. OPTIC LOBE]` ($x \approx -220$) and `[R. OPTIC LOBE]` ($x \approx +220$), resolving the $(0, 0, 0)$ centroid collision with Central Complex.
              - Badges rendered as solid dark pill cards (`0xF00A1220`) with 1px neuropil borders and leader lines—text never clips or collides with dots/lines.
              - Screen-space dynamic vertical separation ensures badges never overlap from any camera orbit angle.
            - **Circuit Highway Signal Flow Indicator:**
              - Real-time 4-stage neural pipeline right below the spectator gauges:
                `[ 👁️ OPTIC ] ──► [ 🧭 COMPASS ] ──► [ 🧠 MUSHROOM ] ──► [ ⚡ MOTOR ]`
              - Live animated chevrons track signals propagating across the Drosophila brain.

            ### SD Card Installation:
            1. Extract `flybrain-nx-switch-v1.3.0.zip` to the root of your SD card (`sdmc:/switch/flybrain-nx/`).
            2. Launch via **Title Override**: Hold `[R]` while launching ANY installed game from the HOME Menu.
            3. Open `flybrain-nx` from the Homebrew Menu.
